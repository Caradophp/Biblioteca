services:
  app:
    build: .
    ports:
      - "8080:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/biblioteca
    depends_on:
      - db

  db:
    image: postgres
    environment:
      POSTGRES_DB: biblioteca
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: